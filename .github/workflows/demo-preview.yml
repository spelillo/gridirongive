name: Demo site

# Publishes the app with sample teams, players and gifts as a Vercel preview
# deployment, so a design can be clicked through on a phone before it reaches
# the live site. It never deploys to production.
#
# The build is made with GG_FORCE_DEMO=1, which makes the app ignore every
# database, Supabase, Stripe and email setting (src/lib/env.ts, baked in by
# next.config.ts). It runs on its embedded demo database and cannot reach the
# real accounts, even though the Vercel project has them.
#
# Runs on every push to a branch other than main, and from the Actions tab.
# The address is in the job summary. Preview deployments sit behind Vercel's
# login (Deployment Protection), so open it while signed in to Vercel.
#
# Repository secret: VERCEL_TOKEN (the same one the Go live job uses).

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

concurrency:
  group: demo-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Find the project
        run: node scripts/demo-preview.mjs prepare
      - name: Deploy a demo-only preview
        id: deploy
        # No --prod: this is a preview deployment and never replaces the live site.
        run: |
          url=$(npx --yes vercel@62.0.0 deploy --yes --token "$VERCEL_TOKEN" --build-env GG_FORCE_DEMO=1 --env GG_FORCE_DEMO=1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Check the demo site
        run: node scripts/demo-preview.mjs check "${{ steps.deploy.outputs.url }}"
